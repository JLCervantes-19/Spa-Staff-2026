<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard — Serenità Staff</title>
  <meta name="theme-color" content="#522566" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/staff.css" />
</head>
<body>

<!-- TOP NAV -->
<nav class="top-nav">
  <div class="top-nav-brand">
    Serenità Staff
    <span>Portal del equipo</span>
  </div>
  <div class="top-nav-actions">
    <button id="btn-logout" class="btn-icon" aria-label="Cerrar sesión" title="Cerrar sesión">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</nav>

<!-- HERO -->
<div class="hero-header" id="hero-header">
  <div class="hero-header-content">
    <p id="saludo-hora" class="heading-accent" style="color:var(--gold);margin-bottom:8px">Buenos días</p>
    <div style="display:flex;align-items:center;gap:14px">
      <div id="hero-avatar"></div>
      <div>
        <h1 class="heading-display" style="font-size:1.8rem;color:var(--white)" id="hero-nombre">Cargando…</h1>
        <p style="font-family:var(--font-body);font-size:0.72rem;color:rgba(255,255,255,0.55);margin-top:4px;letter-spacing:0.1em" id="hero-especialidades"></p>
      </div>
    </div>
    <!-- Gold divider -->
    <div style="width:48px;height:1px;background:var(--gold);margin:16px 0;opacity:0.5"></div>
    <!-- Resumen del día -->
    <div style="display:flex;gap:20px">
      <div>
        <p class="heading-display" style="font-size:2.2rem;color:var(--white)" id="hoy-count">—</p>
        <p style="font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.45)">Citas hoy</p>
      </div>
      <div style="width:1px;background:rgba(255,255,255,0.1)"></div>
      <div>
        <p class="heading-display" style="font-size:2.2rem;color:var(--white)" id="semana-count">—</p>
        <p style="font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.45)">Esta semana</p>
      </div>
      <div style="width:1px;background:rgba(255,255,255,0.1)"></div>
      <div>
        <p class="heading-display" style="font-size:2.2rem;color:var(--white)" id="pendientes-count">—</p>
        <p style="font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.45)">Pendientes</p>
      </div>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<main class="main-content" style="padding-top:0">
  <div class="page-container" style="padding-top:24px">

    <!-- PRÓXIMA CITA -->
    <section class="mb-24">
      <div class="section-header mb-12">
        <h2 class="section-title">Próxima cita</h2>
        <a href="/citas.html" style="font-size:0.72rem;color:var(--lilac);font-weight:500;letter-spacing:0.05em">Ver todas →</a>
      </div>
      <div id="proxima-cita-wrapper">
        <div class="skeleton" style="height:120px"></div>
      </div>
    </section>

    <!-- CITAS DE HOY -->
    <section class="mb-24">
      <div class="section-header mb-12">
        <h2 class="section-title">Hoy</h2>
        <a href="/citas.html" style="font-size:0.72rem;color:var(--lilac);font-weight:500;letter-spacing:0.05em">Ver agenda →</a>
      </div>
      <div id="citas-hoy-list" style="display:flex;flex-direction:column;gap:10px">
        <div class="skeleton" style="height:88px"></div>
        <div class="skeleton" style="height:88px"></div>
      </div>
    </section>

    <!-- ACCESOS RÁPIDOS -->
    <section class="mb-24">
      <h2 class="section-title mb-12">Accesos rápidos</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <a href="/citas.html" style="text-decoration:none">
          <div class="card card-body" style="text-align:center;cursor:pointer">
            <div style="width:44px;height:44px;border-radius:12px;background:var(--lilac-pale);display:flex;align-items:center;justify-content:center;margin:0 auto 10px">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="var(--lilac)" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <p style="font-size:0.72rem;font-weight:500;color:var(--text-dark)">Mis citas</p>
          </div>
        </a>
        <a href="/perfil.html" style="text-decoration:none">
          <div class="card card-body" style="text-align:center;cursor:pointer">
            <div style="width:44px;height:44px;border-radius:12px;background:var(--lilac-pale);display:flex;align-items:center;justify-content:center;margin:0 auto 10px">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="var(--lilac)" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <p style="font-size:0.72rem;font-weight:500;color:var(--text-dark)">Mi perfil</p>
          </div>
        </a>
      </div>
    </section>

  </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="/dashboard.html" class="nav-item active">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Inicio
  </a>
  <a href="/citas.html" class="nav-item">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Mis citas
  </a>
  <a href="/perfil.html" class="nav-item">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Perfil
  </a>
</nav>

<script type="module">
  import { requireAuth, logout, getEmpleadaProfile } from '/js/auth.js'
  import { supabase } from '/js/supabase-client.js'
  import { formatHora, isToday, isThisWeek, ESTADOS, avatarHTML, iniciales } from '/js/utils.js'

  // Auth guard
  const session = await requireAuth()
  if (!session) throw new Error('no session')

  const empleada = await getEmpleadaProfile()
  if (!empleada) { window.location.href = '/index.html'; throw new Error() }

  // Saludo según hora
  const hour = new Date().getHours()
  const saludo = hour < 12 ? 'Buenos días' : hour < 19 ? 'Buenas tardes' : 'Buenas noches'
  document.getElementById('saludo-hora').textContent = saludo

  // Nombre y avatar
  const nombreCompleto = [empleada.nombre, empleada.apellido].filter(Boolean).join(' ')
  document.getElementById('hero-nombre').textContent = nombreCompleto
  document.getElementById('hero-avatar').innerHTML = avatarHTML(empleada, 56)
  if (empleada.especialidades?.length) {
    document.getElementById('hero-especialidades').textContent = empleada.especialidades.join(' · ')
  }

  // Cargar citas
  const hoy = new Date().toISOString().split('T')[0]
  const { data: citas } = await supabase
    .from('citas')
    .select(`
      id, fecha, hora_inicio, hora_fin, estado, notas,
      clientes(id, nombre, telefono),
      servicios(id, nombre, duracion_min)
    `)
    .eq('empleado_id', empleada.id)
    .order('fecha', { ascending: true })
    .order('hora_inicio', { ascending: true })

  const todasCitas = citas || []

  // Contadores
  const citasHoy    = todasCitas.filter(c => c.fecha === hoy)
  const citasSemana = todasCitas.filter(c => isThisWeek(c.fecha))
  const pendientes  = todasCitas.filter(c => c.estado === 'pendiente' || !c.estado)

  document.getElementById('hoy-count').textContent      = citasHoy.length
  document.getElementById('semana-count').textContent   = citasSemana.length
  document.getElementById('pendientes-count').textContent = pendientes.length

  // Próxima cita (la primera pendiente a partir de ahora)
  const ahora = new Date()
  const proxima = todasCitas.find(c => {
    if (c.estado === 'cancelada' || c.estado === 'realizada') return false
    const fechaHora = new Date(`${c.fecha}T${c.hora_inicio || '00:00'}`)
    return fechaHora >= ahora
  })

  const proximaWrapper = document.getElementById('proxima-cita-wrapper')
  if (proxima) {
    const estado = proxima.estado || 'pendiente'
    proximaWrapper.innerHTML = `
      <a href="/cita-detalle.html?id=${proxima.id}" style="text-decoration:none">
        <div class="proxima-cita-card">
          <div class="proxima-cita-card-inner">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
              <div>
                <p style="font-family:var(--font-body);font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:4px">Próxima cita</p>
                <p style="font-family:var(--font-display);font-size:1.3rem;color:var(--white);font-weight:300">${proxima.clientes?.nombre || '—'}</p>
              </div>
              <span class="estado-chip ${estado}">${ESTADOS[estado]?.label || estado}</span>
            </div>
            <p style="font-family:var(--font-body);font-size:0.82rem;color:rgba(255,255,255,0.65);margin-bottom:8px">${proxima.servicios?.nombre || '—'}</p>
            <div style="display:flex;align-items:center;gap:12px">
              <div style="display:flex;align-items:center;gap:6px">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="var(--gold)" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span style="font-size:0.78rem;color:rgba(255,255,255,0.7)">${formatFechaCorta(proxima.fecha)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="var(--gold)" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span style="font-size:0.78rem;color:rgba(255,255,255,0.7)">${formatHora(proxima.hora_inicio)}</span>
              </div>
            </div>
          </div>
        </div>
      </a>
    `
  } else {
    proximaWrapper.innerHTML = `
      <div class="card card-body" style="text-align:center;padding:28px">
        <p style="font-size:0.82rem;color:var(--text-medium);opacity:0.6">No hay citas próximas pendientes</p>
      </div>
    `
  }

  // Citas de hoy
  const listEl = document.getElementById('citas-hoy-list')
  if (citasHoy.length === 0) {
    listEl.innerHTML = `
      <div class="card card-body" style="text-align:center;padding:28px">
        <p style="font-size:0.82rem;color:var(--text-medium);opacity:0.6">No tienes citas agendadas para hoy</p>
      </div>
    `
  } else {
    listEl.innerHTML = citasHoy.map(c => {
      const estado = c.estado || 'pendiente'
      return `
        <a href="/cita-detalle.html?id=${c.id}" style="text-decoration:none">
          <div class="cita-card ${estado}">
            <div class="cita-header">
              <div>
                <p class="cita-nombre">${c.clientes?.nombre || '—'}</p>
                <p class="cita-servicio">${c.servicios?.nombre || '—'}</p>
              </div>
              <span class="estado-chip ${estado}"><span class="dot"></span>${ESTADOS[estado]?.label || estado}</span>
            </div>
            <div class="cita-meta">
              <span class="cita-hora">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${formatHora(c.hora_inicio)}
              </span>
              ${c.servicios?.duracion_min ? `<span style="font-size:0.75rem;color:var(--text-medium);opacity:0.6">${c.servicios.duracion_min} min</span>` : ''}
            </div>
          </div>
        </a>
      `
    }).join('')
  }

  // Realtime — recarga dashboard al recibir nueva cita
  supabase
    .channel(`dashboard-empleada-${empleada.id}`)
    .on('postgres_changes', {
      event:  'INSERT',
      schema: 'public',
      table:  'citas',
      filter: `empleado_id=eq.${empleada.id}`,
    }, () => window.location.reload())
    .subscribe()

  // Logout
  document.getElementById('btn-logout').addEventListener('click', async () => {
    if (confirm('¿Cerrar sesión?')) await logout()
  })

  function formatFechaCorta(fecha) {
    if (!fecha) return '—'
    const d = new Date(fecha + 'T00:00:00')
    return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' })
  }
</script>

</body>
</html>
