<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Serenità Staff — Ingreso</title>
  <meta name="description" content="Portal para el equipo de Serenità Spa" />
  <meta name="theme-color" content="#522566" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Staff" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/staff.css" />
</head>
<body class="login-page-body">

<div class="login-page">
  <!-- Anillos decorativos -->
  <div class="login-ring" style="width:500px;height:500px"></div>
  <div class="login-ring" style="width:800px;height:800px;opacity:0.4"></div>

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5" style="margin:0 auto 12px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <div class="login-title">Serenità Staff</div>
      <span class="login-subtitle">Portal del equipo</span>
    </div>

    <!-- Error -->
    <div id="login-error" class="login-error mb-16"></div>

    <!-- Formulario -->
    <form id="login-form" class="login-form" autocomplete="on" novalidate>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="field-group">
          <label class="field-label" for="email">Correo electrónico</label>
          <input
            id="email" name="email" type="email"
            class="input-field" placeholder="tu@correo.com"
            autocomplete="email" required
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Contraseña</label>
          <div style="position:relative">
            <input
              id="password" name="password" type="password"
              class="input-field" placeholder="••••••••"
              autocomplete="current-password" required
              style="padding-right:48px"
            />
            <button type="button" id="toggle-pass" aria-label="Mostrar contraseña"
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.4);transition:color 0.2s;background:none;border:none;cursor:pointer">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="hidden"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="login-btn">
          <span id="btn-text">Ingresar</span>
          <span id="btn-loading" class="hidden" style="display:inline-flex;align-items:center;gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 0.7s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            Ingresando…
          </span>
        </button>
      </div>
    </form>

    <p style="text-align:center;margin-top:24px;font-size:0.7rem;color:rgba(255,255,255,0.25);line-height:1.6">
      Acceso exclusivo para el equipo de Serenità Spa.<br>
      Si tienes problemas, contacta a tu administradora.
    </p>
  </div>

  <p style="margin-top:24px;font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.15);position:relative;z-index:1">
    © 2026 Serenità Spa
  </p>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script type="module">
  import { login, redirectIfAuth } from '/js/auth.js'

  // Alto real del viewport visible (se achica cuando aparece el teclado en iOS/Android)
  function setAppHeight() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight
    document.documentElement.style.setProperty('--app-height', h + 'px')
  }
  setAppHeight()
  window.visualViewport?.addEventListener('resize', setAppHeight)
  window.addEventListener('resize', setAppHeight)

  // Si ya hay sesión, ir al dashboard
  redirectIfAuth()

  const form   = document.getElementById('login-form')
  const errEl  = document.getElementById('login-error')
  const btn    = document.getElementById('login-btn')
  const btnTxt = document.getElementById('btn-text')
  const btnLdr = document.getElementById('btn-loading')

  // Toggle contraseña
  document.getElementById('toggle-pass').addEventListener('click', () => {
    const inp  = document.getElementById('password')
    const eye  = document.getElementById('eye-icon')
    const eyeOff = document.getElementById('eye-off-icon')
    if (inp.type === 'password') {
      inp.type = 'text'
      eye.classList.add('hidden')
      eyeOff.classList.remove('hidden')
    } else {
      inp.type = 'password'
      eye.classList.remove('hidden')
      eyeOff.classList.add('hidden')
    }
  })

  // Submit
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    const email    = document.getElementById('email').value.trim().toLowerCase()
    const password = document.getElementById('password').value

    // Validación básica
    if (!email || !password) {
      showError('Completa todos los campos.')
      return
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('Ingresa un correo válido.')
      return
    }
    if (password.length < 6) {
      showError('La contraseña debe tener al menos 6 caracteres.')
      return
    }

    setLoading(true)
    try {
      await login(email, password)
      window.location.href = '/dashboard.html'
    } catch (err) {
      showError(err.message)
    } finally {
      setLoading(false)
    }
  })

  function showError(msg) {
    errEl.textContent = msg
    errEl.classList.add('show')
    setTimeout(() => errEl.classList.remove('show'), 6000)
  }
  function setLoading(on) {
    btn.disabled = on
    btnTxt.classList.toggle('hidden', on)
    btnLdr.classList.toggle('hidden', !on)
    btnLdr.style.display = on ? 'inline-flex' : 'none'
  }
</script>

</body>
</html>
