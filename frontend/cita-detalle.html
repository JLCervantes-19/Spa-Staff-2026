<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Detalle de cita — Serenità Staff</title>
  <meta name="theme-color" content="#522566" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/staff.css" />
</head>
<body>

<!-- TOP NAV -->
<nav class="top-nav">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="/citas.html" class="btn-icon" aria-label="Volver">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="top-nav-brand">
      Detalle de cita
      <span>Serenità Staff</span>
    </div>
  </div>
</nav>

<!-- MAIN -->
<main class="main-content">
  <div class="page-container" id="cita-loading">
    <div class="skeleton" style="height:200px;margin-bottom:16px"></div>
    <div class="skeleton" style="height:120px;margin-bottom:16px"></div>
    <div class="skeleton" style="height:180px"></div>
  </div>

  <div class="page-container hidden" id="cita-content">

    <!-- ESTADO HEADER -->
    <div id="estado-header" class="card mb-16" style="overflow:hidden">
      <div id="estado-banner" style="padding:20px 20px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div>
          <p id="det-estado-label" style="font-family:var(--font-accent);font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:8px;opacity:0.7;color:var(--white)">Estado</p>
          <span id="det-estado-chip" class="estado-chip pendiente" style="font-size:0.75rem"></span>
        </div>
        <button id="btn-cambiar-estado" class="btn-sm" style="background:rgba(255,255,255,0.15);color:var(--white);flex-shrink:0;margin-top:4px">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Cambiar
        </button>
      </div>
    </div>

    <!-- DATOS DEL CLIENTE -->
    <div class="card mb-16">
      <div class="card-header">
        <p class="heading-accent">Cliente</p>
      </div>
      <div class="card-body">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
          <div id="cliente-avatar" style="width:48px;height:48px;border-radius:50%;background:var(--lilac-pale);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.2rem;color:var(--purple-dark);flex-shrink:0;border:2px solid rgba(173,116,195,0.2)"></div>
          <div>
            <p id="det-cliente-nombre" class="heading-display" style="font-size:1.15rem;color:var(--text-dark)"></p>
            <p id="det-cliente-telefono" style="font-size:0.82rem;color:var(--text-medium);margin-top:2px"></p>
          </div>
        </div>
        <!-- Tel botón -->
        <a id="link-whatsapp" href="#" target="_blank"
          style="display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(37,211,102,0.08);border:1px solid rgba(37,211,102,0.2);border-radius:10px;color:#16a34a;font-size:0.78rem;font-weight:500;text-decoration:none;transition:all 0.2s">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.526 5.847L.057 23.5l5.816-1.524A11.934 11.934 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.894a9.868 9.868 0 01-5.034-1.378l-.361-.214-3.741.98.999-3.648-.235-.374A9.851 9.851 0 012.106 12C2.106 6.58 6.58 2.106 12 2.106S21.894 6.58 21.894 12 17.42 21.894 12 21.894z"/></svg>
          Contactar por WhatsApp
        </a>
      </div>
    </div>

    <!-- DATOS DE LA CITA -->
    <div class="card mb-16">
      <div class="card-header">
        <p class="heading-accent">Servicio y hora</p>
      </div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <p style="font-family:var(--font-accent);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-medium);opacity:0.7;margin-bottom:4px">Servicio</p>
            <p id="det-servicio" class="heading-display" style="font-size:1.05rem;color:var(--text-dark)"></p>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div>
            <p style="font-family:var(--font-accent);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-medium);opacity:0.7;margin-bottom:4px">Fecha</p>
            <p id="det-fecha" style="font-size:0.9rem;font-weight:500;color:var(--text-dark)"></p>
          </div>
          <div>
            <p style="font-family:var(--font-accent);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-medium);opacity:0.7;margin-bottom:4px">Hora</p>
            <p id="det-hora" style="font-size:0.9rem;font-weight:500;color:var(--text-dark)"></p>
          </div>
          <div>
            <p style="font-family:var(--font-accent);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-medium);opacity:0.7;margin-bottom:4px">Duración</p>
            <p id="det-duracion" style="font-size:0.9rem;font-weight:500;color:var(--text-dark)"></p>
          </div>
          <div>
            <p style="font-family:var(--font-accent);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-medium);opacity:0.7;margin-bottom:4px">Precio</p>
            <p id="det-precio" style="font-size:0.9rem;font-weight:500;color:var(--lilac)"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- NOTAS -->
    <div class="card mb-24" id="notas-section">
      <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
        <p class="heading-accent">Notas</p>
      </div>
      <div class="card-body">
        <p id="det-notas" style="font-size:0.88rem;color:var(--text-medium);line-height:1.6;font-style:italic;opacity:0.7">Sin notas</p>
      </div>
    </div>

  </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="/dashboard.html" class="nav-item">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Inicio
  </a>
  <a href="/citas.html" class="nav-item active">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Mis citas
  </a>
  <a href="/perfil.html" class="nav-item">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Perfil
  </a>
</nav>

<!-- MODAL CAMBIAR ESTADO -->
<div class="modal-overlay" id="modal-estado">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h3 class="modal-title">Cambiar estado</h3>
    <p style="font-size:0.82rem;color:var(--text-medium);margin-bottom:8px" id="modal-cliente-nombre"></p>
    <div class="divider"></div>

    <div class="estado-grid">
      <button class="estado-option pendiente"  data-estado="pendiente">
        <span class="estado-icon">📋</span>
        <span class="estado-label">Pendiente</span>
      </button>
      <button class="estado-option realizada"  data-estado="realizada">
        <span class="estado-icon">✅</span>
        <span class="estado-label">Realizada</span>
      </button>
      <button class="estado-option atrasada"   data-estado="atrasada">
        <span class="estado-icon">⏰</span>
        <span class="estado-label">Atrasada</span>
      </button>
      <button class="estado-option no_asistio" data-estado="no_asistio">
        <span class="estado-icon">❌</span>
        <span class="estado-label">No asistió</span>
      </button>
      <button class="estado-option cancelada"  data-estado="cancelada" style="grid-column:span 2">
        <span class="estado-icon">🚫</span>
        <span class="estado-label">Cancelada</span>
      </button>
    </div>

    <!-- Nota opcional -->
    <div class="field-group mt-12">
      <label class="field-label" for="nota-estado">Nota opcional</label>
      <textarea id="nota-estado" class="input-field" rows="3" placeholder="Agrega una nota sobre este cambio…" maxlength="500" style="resize:none"></textarea>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">
      <button id="btn-confirmar-estado" class="btn-primary" disabled>Confirmar cambio</button>
      <button id="btn-cancelar-modal" class="btn-secondary">Cancelar</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth, getEmpleadaProfile } from '/js/auth.js'
  import { supabase } from '/js/supabase-client.js'
  import { formatFecha, formatHora, ESTADOS, showToast, sanitizeText, iniciales } from '/js/utils.js'

  const session = await requireAuth()
  if (!session) throw new Error()

  const empleada = await getEmpleadaProfile()
  if (!empleada) { window.location.href = '/index.html'; throw new Error() }

  const params = new URLSearchParams(window.location.search)
  const citaId = params.get('id')
  if (!citaId) { window.location.href = '/citas.html'; throw new Error() }

  let citaData = null
  let estadoSeleccionado = null

  // ——— Cargar cita ——————————————————————————————————————
  async function cargarCita() {
    const { data, error } = await supabase
      .from('citas')
      .select(`
        id, fecha, hora_inicio, hora_fin, duracion_total, estado, notas, origen,
        clientes(id, nombre, telefono, email, alergias, notas),
        servicios(id, nombre, descripcion, precio, duracion_min)
      `)
      .eq('id', citaId)
      .eq('empleado_id', empleada.id)
      .single()

    if (error || !data) {
      showToast('Cita no encontrada o sin acceso', 'error')
      setTimeout(() => window.location.href = '/citas.html', 2000)
      return
    }

    citaData = data
    renderCita()
  }

  function renderCita() {
    const c = citaData
    const estado = c.estado || 'pendiente'

    document.getElementById('cita-loading').classList.add('hidden')
    document.getElementById('cita-content').classList.remove('hidden')

    // Estado banner
    const colors = {
      pendiente:  ['#AD74C3', '#F8EDFB'],
      realizada:  ['#16a34a', '#f0fdf4'],
      atrasada:   ['#d97706', '#fffbeb'],
      no_asistio: ['#dc2626', '#fef2f2'],
      cancelada:  ['#6b7280', '#f9fafb'],
    }
    const [textColor, bgColor] = colors[estado] || colors.pendiente
    const banner = document.getElementById('estado-banner')
    banner.style.background = bgColor
    const chip = document.getElementById('det-estado-chip')
    chip.textContent = `${ESTADOS[estado]?.icon || ''} ${ESTADOS[estado]?.label || estado}`
    chip.className = `estado-chip ${estado}`
    chip.style.fontSize = '0.82rem'
    document.getElementById('det-estado-label').style.color = textColor

    // Cliente
    const clienteIni = iniciales(c.clientes?.nombre || '', '')
    document.getElementById('cliente-avatar').textContent = clienteIni
    document.getElementById('det-cliente-nombre').textContent = c.clientes?.nombre || '—'
    document.getElementById('det-cliente-telefono').textContent = c.clientes?.telefono || '—'

    // WhatsApp
    const tel = (c.clientes?.telefono || '').replace(/\D/g, '')
    if (tel) {
      const msg = encodeURIComponent(`Hola ${c.clientes?.nombre || ''}, te escribo del Spa Serenità para confirmar tu cita de ${c.servicios?.nombre || 'servicio'} del ${formatFecha(c.fecha)}.`)
      document.getElementById('link-whatsapp').href = `https://wa.me/57${tel}?text=${msg}`
    } else {
      document.getElementById('link-whatsapp').style.display = 'none'
    }

    // Servicio
    document.getElementById('det-servicio').textContent = c.servicios?.nombre || '—'
    document.getElementById('det-fecha').textContent = formatFecha(c.fecha)
    document.getElementById('det-hora').textContent = `${formatHora(c.hora_inicio)}${c.hora_fin ? ' – ' + formatHora(c.hora_fin) : ''}`
    const duracion = c.duracion_total || c.servicios?.duracion_min
    document.getElementById('det-duracion').textContent = duracion ? `${duracion} min` : '—'
    document.getElementById('det-precio').textContent = c.servicios?.precio
      ? `$${Number(c.servicios.precio).toLocaleString('es-CO')}`
      : '—'

    // Notas
    const notas = c.notas || c.clientes?.notas
    document.getElementById('det-notas').textContent = notas || 'Sin notas'

    // Modal: marcar estado actual
    document.getElementById('modal-cliente-nombre').textContent = c.clientes?.nombre || 'esta cita'
    marcarEstadoModal(estado)
  }

  // ——— Modal estado ————————————————————————————————————
  const modal = document.getElementById('modal-estado')

  document.getElementById('btn-cambiar-estado').addEventListener('click', () => {
    estadoSeleccionado = citaData.estado || 'pendiente'
    marcarEstadoModal(estadoSeleccionado)
    document.getElementById('nota-estado').value = ''
    modal.classList.add('open')
  })

  document.getElementById('btn-cancelar-modal').addEventListener('click', () => {
    modal.classList.remove('open')
  })

  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('open')
  })

  // Opciones de estado
  document.querySelectorAll('.estado-option').forEach(btn => {
    btn.addEventListener('click', () => {
      estadoSeleccionado = btn.dataset.estado
      marcarEstadoModal(estadoSeleccionado)
      document.getElementById('btn-confirmar-estado').disabled = false
    })
  })

  function marcarEstadoModal(estado) {
    document.querySelectorAll('.estado-option').forEach(b => {
      b.classList.toggle('selected', b.dataset.estado === estado)
    })
  }

  // Confirmar cambio
  document.getElementById('btn-confirmar-estado').addEventListener('click', async () => {
    if (!estadoSeleccionado) return

    const nota = sanitizeText(document.getElementById('nota-estado').value.trim())
    const btnConfirmar = document.getElementById('btn-confirmar-estado')
    btnConfirmar.disabled = true
    btnConfirmar.textContent = 'Guardando…'

    const updateData = { estado: estadoSeleccionado }
    if (nota) updateData.notas = nota

    const { error } = await supabase
      .from('citas')
      .update(updateData)
      .eq('id', citaData.id)
      .eq('empleado_id', empleada.id)

    if (error) {
      showToast('Error al actualizar. Intenta de nuevo.', 'error')
      btnConfirmar.disabled = false
      btnConfirmar.textContent = 'Confirmar cambio'
      return
    }

    citaData.estado = estadoSeleccionado
    if (nota) citaData.notas = nota
    modal.classList.remove('open')
    renderCita()
    showToast(`Estado actualizado: ${ESTADOS[estadoSeleccionado]?.label}`, 'success')
    btnConfirmar.textContent = 'Confirmar cambio'
  })

  await cargarCita()
</script>

</body>
</html>
